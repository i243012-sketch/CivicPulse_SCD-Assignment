# Docker Compose for CivicPulse - Development Environment
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: civicpulse-postgres-dev
    environment:
      POSTGRES_DB: civicpulse
      POSTGRES_USER: civicpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civicpulse-network

  redis:
    image: redis:7-alpine
    container_name: civicpulse-redis-dev
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - civicpulse-network

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: civicpulse-backend-dev
    environment:
      - DATABASE_URL=postgresql+psycopg2://civicpulse:${POSTGRES_PASSWORD:-dev_password_change_in_prod}@postgres:5432/civicpulse
      - REDIS_URL=redis://redis:6379/0
      - TRIAGE_PROVIDER=${TRIAGE_PROVIDER}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEBUG=true
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_PER_MINUTE=10
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/meta/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        alembic upgrade head &&
        python /app/scripts/seed.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    volumes:
      - ./backend/app:/app/app:ro
    networks:
      - civicpulse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicpulse-frontend-dev
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - civicpulse-network

networks:
  civicpulse-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
