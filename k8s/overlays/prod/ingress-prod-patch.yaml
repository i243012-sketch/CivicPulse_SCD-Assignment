apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicpulse-ingress
  namespace: civicpulse
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - civicpulse.example.com
      secretName: civicpulse-tls
  rules:
    - host: civicpulse.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
