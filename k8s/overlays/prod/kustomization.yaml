apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: civicpulse-prod

namePrefix: prod-

labels:
  - pairs:
      environment: prod

resources:
  - ../../base

configMapGenerator:
  - name: civicpulse-config
    behavior: merge
    literals:
      - DATABASE_HOST=prod-postgres
      - REDIS_HOST=prod-redis
      - DEBUG=false
      - LOG_LEVEL=INFO
      - TRIAGE_PROVIDER=llm
      - RATE_LIMIT_PER_MINUTE=100

patches:
  - path: backend-prod-patch.yaml
  - path: frontend-prod-patch.yaml
  - path: postgres-prod-patch.yaml
  - path: ingress-prod-patch.yaml

images:
  - name: civicpulse-backend
    newTag: v1.0.0
  - name: civicpulse-frontend
    newTag: v1.0.0

replicas:
  - name: backend
    count: 3
  - name: frontend
    count: 3
