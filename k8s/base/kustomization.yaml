apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: civicpulse

resources:
  - namespace.yaml
  - secret.yaml
  - postgres-statefulset.yaml
  - redis-deployment.yaml
  - backend-deployment.yaml
  - backend-hpa.yaml
  - backend-pdb.yaml
  - frontend-deployment.yaml
  - ingress.yaml

configMapGenerator:
  - name: civicpulse-config
    literals:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=civicpulse
      - DATABASE_USER=civicpulse
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEBUG=false
      - LOG_LEVEL=INFO
      - TRIAGE_PROVIDER=llm
      - GROQ_MODEL=llama-3.3-70b-versatile
      - GROQ_TIMEOUT=10
      - GROQ_MAX_RETRIES=1
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_PER_MINUTE=60

labels:
  - pairs:
      app.kubernetes.io/name: civicpulse
      app.kubernetes.io/component: application

configurations:
  - name-reference.yaml

