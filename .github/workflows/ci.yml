name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev

jobs:
  lint-and-type:
    name: Lint and Type Check (ruff + tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run ruff on backend
        run: |
          cd backend
          python -m ruff check app/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint on frontend
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript type check on frontend
        run: |
          cd frontend
          npx tsc --noEmit

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      TRIAGE_PROVIDER: simulated
      GROQ_API_KEY: fake-key-for-testing
      RATE_LIMIT_ENABLED: false
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Run tests with coverage
        run: |
          cd backend
          PYTHONPATH=. pytest -v --cov=app --cov-report=term-missing

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Check if Vitest is configured
        run: |
          cd frontend
          if ! grep -q "vitest" package.json; then
            echo "⚠️  Vitest not yet configured in package.json"
            echo "Frontend component tests will be added in future PR"
            exit 0
          fi

      - name: Run Vitest tests
        if: success()
        run: |
          cd frontend
          npm run test

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build -t civicpulse-backend:ci-${{ github.sha }} -f backend/Dockerfile .

      - name: Build frontend image
        run: |
          docker build -t civicpulse-frontend:ci-${{ github.sha }} -f frontend/Dockerfile frontend/

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for testing
        run: |
          cat > .env << EOF
          POSTGRES_PASSWORD=ci_test_password
          GROQ_API_KEY=fake-groq-key
          TRIAGE_PROVIDER=simulated
          EOF

      - name: Start services with Docker Compose
        run: |
          docker compose up -d

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for /api/meta/ready to return 200..."
          timeout 120 bash -c 'until curl -sf http://localhost:8000/api/meta/ready > /dev/null; do sleep 2; done'
          echo "✅ Backend is ready!"

      - name: Verify health endpoint
        run: |
          response=$(curl -s http://localhost:8000/api/meta/health)
          echo "Health response: $response"
          if ! echo "$response" | grep -q '"status":"healthy"'; then
            echo "❌ Health check failed"
            exit 1
          fi
          echo "✅ Health check passed"

      - name: POST a complaint
        run: |
          response=$(curl -s -X POST http://localhost:8000/api/complaints \
            -H "Content-Type: application/json" \
            -d '{"text":"Integration test complaint from CI","location":"Test Location"}')
          echo "Created complaint: $response"
          
          # Extract complaint ID
          complaint_id=$(echo "$response" | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
          echo "Complaint ID: $complaint_id"
          echo "COMPLAINT_ID=$complaint_id" >> $GITHUB_ENV
          
          # Verify category is set
          category=$(echo "$response" | grep -o '"category":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$category" ]; then
            echo "❌ Category not set on created complaint"
            exit 1
          fi
          echo "✅ Complaint created with category: $category"

      - name: GET the complaint back
        run: |
          response=$(curl -s http://localhost:8000/api/complaints/${{ env.COMPLAINT_ID }})
          echo "Retrieved complaint: $response"
          
          if ! echo "$response" | grep -q "${{ env.COMPLAINT_ID }}"; then
            echo "❌ Failed to retrieve complaint by ID"
            exit 1
          fi
          echo "✅ Complaint retrieved successfully"

      - name: Verify X-Cache header on /api/stats (MISS then HIT)
        run: |
          # First request should be MISS
          echo "First request to /api/stats (should be cache MISS)..."
          cache_header_1=$(curl -si http://localhost:8000/api/stats | grep -i "x-cache:" | tr -d '\r')
          echo "Cache header: $cache_header_1"
          
          if ! echo "$cache_header_1" | grep -qi "MISS"; then
            echo "❌ Expected cache MISS on first request"
            exit 1
          fi
          echo "✅ First request: Cache MISS (as expected)"
          
          # Second request should be HIT
          sleep 1
          echo "Second request to /api/stats (should be cache HIT)..."
          cache_header_2=$(curl -si http://localhost:8000/api/stats | grep -i "x-cache:" | tr -d '\r')
          echo "Cache header: $cache_header_2"
          
          if ! echo "$cache_header_2" | grep -qi "HIT"; then
            echo "❌ Expected cache HIT on second request"
            exit 1
          fi
          echo "✅ Second request: Cache HIT (as expected)"

      - name: Show backend logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker compose logs backend
          echo "=== Postgres logs ==="
          docker compose logs postgres
          echo "=== Redis logs ==="
          docker compose logs redis

      - name: Tear down services
        if: always()
        run: |
          docker compose down -v
